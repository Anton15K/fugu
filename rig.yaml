version: "0.2"
name: fugu
summary: Task-autonomous Codex team covering Fugu engineering, security, QA and delivery.
culture_file: rig/CULTURE.md
docs:
  - path: rig/README.md
startup:
  files:
    - path: rig/context/project.md
      delivery_hint: guidance_merge
      required: true
  actions:
    - type: startup_proof
      value: authenticated
      idempotent: true
    - type: send_text
      value: "Complete authenticated startup orientation, verify your identity and role, report readiness to the lead (the lead records its own readiness), and wait for an assigned outcome. Do not start product work."
      phase: after_ready
      idempotent: true
pods:
  - id: control
    label: Coordination
    members:
      - id: lead
        agent_ref: local:rig/agents/lead
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        codex_config_profile: fugu-rig-high
        cwd: "."
    edges: []
  - id: build
    label: Engineering
    members:
      - id: backend
        agent_ref: local:rig/agents/backend
        profile: default
        runtime: codex
        model: gpt-6-luna
        codex_config_profile: fugu-rig-high
        cwd: "."
      - id: frontend
        agent_ref: local:rig/agents/frontend
        profile: default
        runtime: codex
        model: gpt-6-luna
        codex_config_profile: fugu-rig-high
        cwd: "."
    edges: []
  - id: research
    label: Security research
    members:
      - id: security
        agent_ref: local:rig/agents/security
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        codex_config_profile: fugu-rig-high
        cwd: "."
    edges: []
  - id: quality
    label: Independent review and QA
    members:
      - id: reviewer
        agent_ref: local:rig/agents/reviewer
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        codex_config_profile: fugu-rig-high
        cwd: "."
    edges: []
  - id: delivery
    label: Documentation and release
    members:
      - id: release
        agent_ref: local:rig/agents/release
        profile: default
        runtime: codex
        model: gpt-6-luna
        codex_config_profile: fugu-rig-medium
        cwd: "."
    edges: []
edges:
  - kind: delegates_to
    from: control.lead
    to: build.backend
  - kind: delegates_to
    from: control.lead
    to: build.frontend
  - kind: delegates_to
    from: control.lead
    to: research.security
  - kind: delegates_to
    from: control.lead
    to: quality.reviewer
  - kind: delegates_to
    from: control.lead
    to: delivery.release
  - kind: can_observe
    from: quality.reviewer
    to: build.backend
  - kind: can_observe
    from: quality.reviewer
    to: build.frontend
  - kind: can_observe
    from: quality.reviewer
    to: research.security
  - kind: can_observe
    from: quality.reviewer
    to: delivery.release
