name: fugu-reviewer
version: "1.0"
description: Fugu reviewer specialist with task-autonomous project guidance.
defaults:
  runtime: codex
imports:
  - ref: path:/opt/homebrew/lib/node_modules/@openrig/cli/daemon/specs/agents/shared
profiles:
  default:
    uses:
      skills: [shared:review-team, shared:systematic-debugging, shared:verification-before-completion, shared:agent-browser, shared:dogfood]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:codex-default-config]
resources:
  guidance:
    - id: role
      path: guidance/role.md
startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
