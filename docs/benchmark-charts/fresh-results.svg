   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183548" x="54" y="466.128" transform="rotate(-0 54 466.128)">Colored = observed detections/flags   ·   Light gray = completed without a flag   ·   Amber hatching = incomplete</text>
  </g>
  <g id="text_36">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183548" x="54" y="488.592" transform="rotate(-0 54 488.592)">Primary rates use planned cases. Live attacks: 26 detections + 2 completed misses + 2 incomplete; conditional 26/28 = 92.9%.</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637381" x="54" y="508.248" transform="rotate(-0 54 508.248)">Live sample: 10 attacks per paradigm; 20 constructed clean tool descriptions; 5 public skills per repository. Cohorts stay separate.</text>
  </g>
  <g id="text_38">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637381" x="54" y="527.904" transform="rotate(-0 54 527.904)">Tool inputs contain names and descriptions only. Benign flags require adjudication. These charts do not measure S3 detonation or S4 behavior.</text>
  </g>
 </g>
