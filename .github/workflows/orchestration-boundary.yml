name: Orchestration boundary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  framework-free-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify boundary regression cases
        run: python -m unittest discover -s tests -p test_orchestration_boundary.py -v
      - name: Reject tracked orchestration setup
        run: python tools/check_orchestration_boundary.py
